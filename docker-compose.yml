# =========================================================================================
# The whole application, described as four containers.
#
#   sqlserver  - the database.  NOT reachable from the internet.
#   backend    - the .NET API.  NOT reachable from the internet.
#   frontend   - nginx serving React AND proxying /api to the backend.
#   caddy      - the TLS edge.  Only starts when the "tls" profile is active.
#
# Two shapes, and .env alone decides which one you get - this file is never edited:
#
#   PLAIN HTTP (the default)   frontend publishes 0.0.0.0:80, caddy does not start.
#                              Right for a laptop, and for a server with no domain yet.
#
#   HTTPS (COMPOSE_PROFILES=tls)  caddy publishes 80 + 443 and gets a free Let's Encrypt
#                              certificate by itself; frontend retreats to 127.0.0.1:8080
#                              where only caddy can reach it. Needs a real hostname
#                              pointing at the server. Run scripts/enable-https.sh.
#
# Everything comes from the .env file that sits next to this file on the server. That file
# is git-ignored and never leaves the VPS, which is why no password appears below.
# =========================================================================================

services:

  # ---------------------------------------------------------------------------------------
  # SQL Server
  # ---------------------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: qre-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      # Express is the free-for-production edition. Its limits: 4 cores, ~1.4 GB buffer
      # pool, 50 GB per database. Property photos live in the DB as varbinary, so the
      # 50 GB ceiling is the number that matters here.
      MSSQL_PID: Express
      # Keep SQL Server from claiming all 11 GB of the VPS and starving the API.
      MSSQL_MEMORY_LIMIT_MB: "2048"

    # NOTE: there is deliberately NO "ports:" section. Without it, port 1433 exists only on
    # Docker's private network. The database is invisible to the internet no matter what the
    # firewall says - which matters because Docker writes its own iptables rules and can
    # publish a port straight past UFW.
    volumes:
      - mssql-data:/var/opt/mssql

    # The API must not start migrating until SQL Server actually answers queries. This probe
    # runs a trivial SELECT; the backend waits for it to pass.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # ASP.NET Core API
  # ---------------------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: qre-backend:latest
    container_name: qre-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # .NET turns a double underscore into a config-section separator, so this environment
      # variable overrides ConnectionStrings:RealEstateDb from appsettings.json. "sqlserver"
      # is the service name above - Docker's DNS resolves it to that container.
      # The application connects as DB_USER, NOT as sa.
      #
      # sa is the SQL Server superuser: it can read and drop every database on the instance,
      # change server configuration, add logins, and enable features that run operating-system
      # commands. The application needs full rights on its own database and nothing else, so a
      # leaked connection string should cost one database, not the instance.
      #
      # ./scripts/create-db-user.sh creates that login and prints the two lines to add to
      # .env. Until it has been run, DB_USER/DB_PASSWORD are unset and this falls back to sa
      # so an existing deployment keeps working — the fallback is a migration path, not the
      # intended state.
      ConnectionStrings__RealEstateDb: "Server=sqlserver,1433;Database=QatarRealEstate;User Id=${DB_USER:-sa};Password=${DB_PASSWORD:-${SA_PASSWORD}};TrustServerCertificate=True;"

      Jwt__Secret: ${JWT_SECRET}

      MainAdmin__Email: ${MAIN_ADMIN_EMAIL}
      MainAdmin__Password: ${MAIN_ADMIN_PASSWORD}
      MainAdmin__FullName: ${MAIN_ADMIN_NAME}

      # Same-origin means CORS never actually fires, but the allowlist is kept accurate so
      # nothing surprises you if a request ever does come from elsewhere.
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN}

      Startup__ApplyMigrations: "true"
      Startup__UseHttpsRedirection: "false"

      # ---- Seeding -------------------------------------------------------------------
      # These two are the BOOTSTRAP: the roles, the Main Admin, the default positions and
      # the reference catalogs (property types, feature list). They are safe to leave on
      # forever — each batch is recorded in a SeedHistory table and runs exactly once, so a
      # restart never re-inserts anything, and anything you delete stays deleted.
      Startup__SeedIdentity: "true"
      Startup__SeedReferenceData: "true"
      #
      # DEMO CONTENT IS NOT HERE, ON PURPOSE. The old single SEED_DATA flag did both jobs:
      # it created the Main Admin (mandatory for a first deploy) AND inserted 49 invented
      # listings with invented consultants and invented phone numbers. You had to turn it
      # on — and leaving it on is what put the demo listings back every time the container
      # restarted, which is the bug behind "I deleted the demo data and it came back".
      #
      # Demo content is now an explicit command, and it refuses to run in Production:
      #     docker compose run --rm backend seed --demo
      #
      # SEED_DATA in .env is no longer passed to the app at all. The application still
      # understands it (Startup:SeedData) so an older deployment keeps working, but it now
      # means only "bootstrap this deployment" and logs a deprecation warning. You can delete
      # the line from .env.

      # Where Identity's key ring is written. Without this the keys land in the container's
      # writable layer and are destroyed on every rebuild, which invalidates every
      # outstanding password-reset and email-confirmation token. The path is created and
      # chowned in Dockerfile.backend before the USER switch.
      DataProtection__KeyRingPath: /home/app/.aspnet/DataProtection-Keys

    depends_on:
      sqlserver:
        condition: service_healthy

    # Keeps the key ring across "docker compose down", rebuilds and reboots.
    volumes:
      - dpkeys:/home/app/.aspnet/DataProtection-Keys

    # Again no "ports:". The API listens on 8080 inside the private network; only nginx
    # talks to it.
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # nginx: React static files + /api reverse proxy
  # ---------------------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # Vite bakes these into the JavaScript bundle at BUILD time. Changing either one
      # requires a rebuild of this image, not just a restart.
      args:
        VITE_API_URL: ${PUBLIC_ORIGIN}
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
        VITE_SITE_URL: ${PUBLIC_ORIGIN}
    image: qre-frontend:latest
    container_name: qre-frontend

    # WHERE nginx is published, driven entirely from .env so that turning HTTPS on never
    # means editing this file:
    #
    #   unset (the default)        -> 0.0.0.0:80. Plain HTTP straight from nginx. This is
    #                                 right on a laptop, and right on a bare IP: Let's
    #                                 Encrypt cannot issue a certificate for an IP, and
    #                                 Caddy's self-signed CA would both warn every visitor
    #                                 AND break the app (the bundle is built against
    #                                 http://<ip>, so the browser blocks those calls as
    #                                 mixed content). Plain HTTP is the honest option
    #                                 until a hostname exists.
    #
    #   FRONTEND_BIND=127.0.0.1:8080 -> reachable only from inside the server, because
    #                                 Caddy now owns 80 and 443 and proxies to it. Set
    #                                 this together with COMPOSE_PROFILES=tls.
    #
    # scripts/enable-https.sh sets both for you. Note the bind address matters: without
    # the 127.0.0.1 prefix Docker would publish nginx on every interface and bypass
    # Caddy - and Docker writes its own iptables rules, so a firewall would not stop it.
    ports:
      - "${FRONTEND_BIND:-0.0.0.0:80}:80"

    depends_on:
      - backend

    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # Caddy: the TLS edge. The ONLY container exposed to the internet.
  #
  # Obtains and renews the certificate by itself - no certbot, no cron, no nginx reload.
  # See docker/caddy/Caddyfile for the two modes (self-signed vs Let's Encrypt).
  #
  # OFF BY DEFAULT, and not by being commented out: the `profiles` key below means Compose
  # skips this service entirely unless the "tls" profile is active. So this stays a normal,
  # validated part of the file - `docker compose config` checks it, CI builds it - while a
  # laptop or a bare-IP server simply never starts it.
  #
  # To turn HTTPS on, once DNS points a hostname at this server, set these in .env:
  #     COMPOSE_PROFILES=tls             <- starts this service
  #     FRONTEND_BIND=127.0.0.1:8080     <- hands ports 80/443 over to Caddy
  #     SITE_ADDRESS=www.yourdomain.com
  #     CADDY_TLS=you@yourdomain.com     <- an email switches Caddy to Let's Encrypt
  #     PUBLIC_ORIGIN=https://www.yourdomain.com
  # then: docker compose build frontend && docker compose up -d
  #       (the rebuild is NOT optional - Vite bakes PUBLIC_ORIGIN into the JS bundle)
  #
  # scripts/enable-https.sh does all of the above, and checks DNS first.
  # ---------------------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: qre-caddy
    restart: unless-stopped
    profiles: ["tls"]

    ports:
      - "80:80"        # HTTP-01 validation + the redirect to HTTPS. Must stay open.
      - "443:443"      # HTTPS
      - "443:443/udp"  # HTTP/3 (QUIC). Harmless if your firewall drops UDP.

    environment:
      # All three come from .env. See docker/caddy/Caddyfile for what they accept.
      SITE_ADDRESS: ${SITE_ADDRESS:-:443}
      CADDY_TLS: ${CADDY_TLS:-internal}
      # max-age=0 = no HSTS in force, and it also CLEARS a policy a browser cached
      # earlier. The right default until a REAL certificate is being served; read the
      # warning in the Caddyfile before raising it.
      CADDY_HSTS: ${CADDY_HSTS:-max-age=0}

    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_data holds the issued certificates and the ACME account key. It MUST persist:
      # losing it means re-requesting certificates on every restart, which will hit Let's
      # Encrypt's rate limit (50 certs per domain per week) and then fail outright.
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - frontend

# -----------------------------------------------------------------------------------------
# Named volumes, so state survives "docker compose down", image rebuilds, container
# recreation and VPS reboots. Deleting them is the ONLY way to lose the data.
#   mssql-data   - the database
#   caddy_data   - TLS certificates + the ACME account key (see the warning above)
#   dpkeys       - the DataProtection key ring; losing it logs everyone's pending
#                  password-reset and email-confirmation links out, nothing worse
#
# Compose prefixes these with the project name, so on disk they are qre_mssql-data,
# qre_caddy_data, qre_caddy_config and qre_dpkeys. Use the prefixed names with
# "docker volume inspect".
# -----------------------------------------------------------------------------------------
volumes:
  mssql-data:
  caddy_data:
  caddy_config:
  dpkeys:

# -----------------------------------------------------------------------------------------
# BACKUPS
#
# mssql-data above is the ONLY copy of every listing, every photo (photos are varbinary
# columns, not files) and every lead. A Docker volume is not a backup: it does not survive
# `docker compose down -v`, a mistyped `docker volume rm`, or the disk it sits on.
#
#     ./scripts/backup-db.sh          → ./backups/QatarRealEstate-<date>.bak
#     ./scripts/restore-db.sh <file>  → restores into a scratch database, live untouched
#
# Put the backup on a cron job and copy ./backups off this machine:
#     30 2 * * *  cd /opt/qre && ./scripts/backup-db.sh >> /var/log/qre-backup.log 2>&1
#
# Then run the restore rehearsal at least once. An untested backup is a guess.
# -----------------------------------------------------------------------------------------
