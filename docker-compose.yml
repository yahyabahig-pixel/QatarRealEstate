# =========================================================================================
# The whole application, described as three containers.
#
#   sqlserver  - the database.  NOT reachable from the internet.
#   backend    - the .NET API.  NOT reachable from the internet.
#   frontend   - nginx serving React AND proxying /api to the backend.  NOT reachable
#                from the internet either, since Caddy went in front of it.
#   caddy      - the TLS edge.  The ONLY container that publishes ports (80, 443).
#
# Everything comes from the .env file that sits next to this file on the server. That file
# is git-ignored and never leaves the VPS, which is why no password appears below.
# =========================================================================================

services:

  # ---------------------------------------------------------------------------------------
  # SQL Server
  # ---------------------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: qre-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      # Express is the free-for-production edition. Its limits: 4 cores, ~1.4 GB buffer
      # pool, 50 GB per database. Property photos live in the DB as varbinary, so the
      # 50 GB ceiling is the number that matters here.
      MSSQL_PID: Express
      # Keep SQL Server from claiming all 11 GB of the VPS and starving the API.
      MSSQL_MEMORY_LIMIT_MB: "2048"

    # NOTE: there is deliberately NO "ports:" section. Without it, port 1433 exists only on
    # Docker's private network. The database is invisible to the internet no matter what the
    # firewall says - which matters because Docker writes its own iptables rules and can
    # publish a port straight past UFW.
    volumes:
      - mssql-data:/var/opt/mssql

    # The API must not start migrating until SQL Server actually answers queries. This probe
    # runs a trivial SELECT; the backend waits for it to pass.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # ASP.NET Core API
  # ---------------------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: qre-backend:latest
    container_name: qre-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # .NET turns a double underscore into a config-section separator, so this environment
      # variable overrides ConnectionStrings:RealEstateDb from appsettings.json. "sqlserver"
      # is the service name above - Docker's DNS resolves it to that container.
      ConnectionStrings__RealEstateDb: "Server=sqlserver,1433;Database=QatarRealEstate;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"

      Jwt__Secret: ${JWT_SECRET}

      MainAdmin__Email: ${MAIN_ADMIN_EMAIL}
      MainAdmin__Password: ${MAIN_ADMIN_PASSWORD}
      MainAdmin__FullName: ${MAIN_ADMIN_NAME}

      # Same-origin means CORS never actually fires, but the allowlist is kept accurate so
      # nothing surprises you if a request ever does come from elsewhere.
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN}

      Startup__ApplyMigrations: "true"
      Startup__SeedData: ${SEED_DATA}
      Startup__UseHttpsRedirection: "false"

    depends_on:
      sqlserver:
        condition: service_healthy

    # Again no "ports:". The API listens on 8080 inside the private network; only nginx
    # talks to it.
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # nginx: React static files + /api reverse proxy
  # ---------------------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # Vite bakes these into the JavaScript bundle at BUILD time. Changing either one
      # requires a rebuild of this image, not just a restart.
      args:
        VITE_API_URL: ${PUBLIC_ORIGIN}
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
    image: qre-frontend:latest
    container_name: qre-frontend

    # No "ports:" any more. Caddy is the only container that publishes to the internet;
    # nginx is reachable only from inside the Docker network, as caddy:80 -> frontend:80.
    # (To go back to plain HTTP, restore `ports: ["80:80"]` here and drop the caddy service.)
    expose:
      - "80"

    depends_on:
      - backend

    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # Caddy: the TLS edge. The ONLY container exposed to the internet.
  #
  # Obtains and renews the certificate by itself - no certbot, no cron, no nginx reload.
  # See docker/caddy/Caddyfile for the two modes (self-signed vs Let's Encrypt).
  # ---------------------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: qre-caddy
    restart: unless-stopped

    ports:
      - "80:80"        # HTTP-01 validation + the redirect to HTTPS. Must stay open.
      - "443:443"      # HTTPS
      - "443:443/udp"  # HTTP/3 (QUIC). Harmless if your firewall drops UDP.

    environment:
      # Both come from .env. See docker/caddy/Caddyfile for what they accept.
      SITE_ADDRESS: ${SITE_ADDRESS:-:443}
      CADDY_TLS: ${CADDY_TLS:-internal}

    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_data holds the issued certificates and the ACME account key. It MUST persist:
      # losing it means re-requesting certificates on every restart, which will hit Let's
      # Encrypt's rate limit (50 certs per domain per week) and then fail outright.
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - frontend

# -----------------------------------------------------------------------------------------
# Named volumes, so state survives "docker compose down", image rebuilds, container
# recreation and VPS reboots. Deleting them is the ONLY way to lose the data.
#   mssql-data   - the database
#   caddy_data   - TLS certificates + the ACME account key (see the warning above)
# -----------------------------------------------------------------------------------------
volumes:
  mssql-data:
  caddy_data:
  caddy_config:
