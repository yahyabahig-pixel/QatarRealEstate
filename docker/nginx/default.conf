# ---------------------------------------------------------------------------------------
# Nginx config that ships INSIDE the frontend container.
#
# This one server block does two jobs at once:
#   1. serves the compiled React files
#   2. forwards every /api/... request to the backend container
#
# Because both come from the same origin, the browser never treats an API call as
# cross-origin, so CORS preflight never happens. That removes an entire class of
# deployment failure.
#
# Restored 2026-07-30: this file was added in c2bc3d7 and accidentally deleted by
# 60ade72, which is why `COPY docker/nginx/default.conf` stopped resolving.
# ---------------------------------------------------------------------------------------

# Docker's built-in DNS server. Needed because we resolve "backend" at request time
# (see below) instead of at startup.
resolver 127.0.0.11 ipv6=off valid=10s;

# Caddy terminates TLS and talks to this container over plain HTTP, so $scheme here is
# always "http". Forwarding that to Kestrel would make UseHttpsRedirection bounce the
# browser forever the day it gets switched on. Trust the edge's header when it is present
# and fall back to $scheme when nginx is reached directly (the pre-Caddy behaviour).
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ~.+     $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;                       # match any hostname: works for a bare IP

    # ---- Security headers ------------------------------------------------------------
    # Hide the nginx version in responses and error pages.
    server_tokens off;
    # NOTE (nginx behaviour): add_header directives are inherited by a location ONLY
    # if that location declares no add_header of its own. The /assets/ and index.html
    # locations below set Cache-Control, so the same include is REPEATED there.
    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;          # where the built React files land
    index index.html;

    # Property image uploads go through here. Nginx's default cap is 1 MB, which would
    # reject any real photo with a 413 before the request ever reached .NET.
    client_max_body_size 25m;

    # Compress text responses. Typically cuts the JS bundle transfer by ~70%.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API proxy -------------------------------------------------------------------
    location /api/ {
        # Assigning the address to a variable forces nginx to look up "backend" through
        # Docker DNS on each request rather than once at boot. Without this, nginx
        # refuses to start if the backend container isn't up yet, and never recovers.
        set $api_backend http://backend:8080;

        # $request_uri is required here: when proxy_pass contains a variable, nginx stops
        # appending the original path automatically.
        proxy_pass $api_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;

        # Photos are posted as multipart bodies up to the 25 MB cap above; stream them
        # through instead of spooling the whole request to disk first.
        proxy_request_buffering off;
    }

    # ---- Static assets ---------------------------------------------------------------
    # Vite fingerprints these filenames (app-a3f9c2.js), so the content at a given URL can
    # never change. Safe to cache for a year. try_files ... =404 is deliberate: a missing
    # bundle must 404 rather than fall through to index.html, which the browser would then
    # try to parse as JavaScript.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # repeated: this location declares add_header, which drops the server-level set
        include /etc/nginx/snippets/security-headers.conf;
    }

    # index.html must NOT be cached, or browsers keep loading the old app after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
        # repeated: this location declares add_header, which drops the server-level set
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- SPA fallback ----------------------------------------------------------------
    # React Router owns routes like /properties/12. Nginx has no such file, so without
    # this line a page refresh on any route returns 404. try_files serves index.html
    # instead and lets React render the route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
