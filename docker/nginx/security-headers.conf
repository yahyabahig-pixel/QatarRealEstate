# ---------------------------------------------------------------------------------------
# Security response headers, in ONE file.
#
# nginx inherits add_header from the server block into a location ONLY while that location
# declares no add_header of its own. Two locations here set Cache-Control, so the whole set
# used to be copy-pasted into each of them — three copies that had to be kept in step by
# hand. They now `include` this file instead.
# ---------------------------------------------------------------------------------------

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# ---- Content-Security-Policy ------------------------------------------------------------
# There was no CSP at all. The map library was being pulled into every page — the admin
# property form included — from unpkg.com at a floating major version with no integrity
# check, and the admin's JWT sits in sessionStorage where any script on the page can read
# it. MapLibre is now bundled and served from this origin, and this policy is what stops a
# script from anywhere else running at all.
#
# Each source below is here for a reason; removing one breaks the thing named next to it.
#   script-src  'self'               — the app bundle and /vendor/mapbox-gl-rtl-text.min.js
#   style-src   'unsafe-inline'      — React style={{...}} attributes and MapLibre's own
#                                      injected styles. Removing it needs every inline
#                                      style moved into a class first.
#   img-src     https:               — listing photos can be any URL an admin pastes in,
#                                      plus map sprites. data:/blob: are mock-mode previews
#                                      and canvas exports.
#   font-src    fonts.gstatic.com    — Plus Jakarta Sans + IBM Plex Sans Arabic
#   style-src   fonts.googleapis.com — the stylesheet that declares those fonts
#   connect-src tiles.openfreemap.org— vector map tiles, sprites and glyphs
#   connect-src photon.komoot.io     — the place-name geocoder behind the map's search box
#                                      and the admin property form's address lookup
#                                      (frontend/src/lib/geo.js). Leaving it out silently
#                                      kills both: the search box swallows the error and
#                                      simply returns no suggestions.
#   worker-src  blob:                — MapLibre runs its tile parser in a blob worker
#   frame-ancestors 'none'           — this site is never framed; stops clickjacking
#   object-src 'none', base-uri 'self', form-action 'self' — no plugins, no <base>
#                                      rewriting, no posting the login form elsewhere
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://tiles.openfreemap.org https://photon.komoot.io; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
